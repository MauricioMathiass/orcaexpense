# API (pasta Backend) no Render. Em render.com: New > Blueprint e aponte para este repositório.
# As variáveis marcadas com `sync: false` você preenche no painel do Render (nunca no git).
# O Backend é um app Node comum: em Railway, Fly etc. use os mesmos comandos e variáveis.

services:
  - type: web
    name: orcaexpense-api
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon > conexão COM pool (host "-pooler"): DATABASE_URL do Backend/.env.local.
      - key: DATABASE_URL
        sync: false
      # NEON_AUTH_BASE_URL e NEON_AUTH_JWKS_URL do Backend/.env.local.
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      # Endereço do site no Netlify, ex.: https://meu-site.netlify.app (vários: separe por vírgula).
      - key: CORS_ORIGIN
        sync: false
